name: Deployment Pipeline
description: |
  Pipeline de despliegue para el proyecto de Machine Learning con SageMaker.
  Este pipeline valida datos, entrena un modelo, lo despliega y realiza pruebas.

on:
  push:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Show environment info
        run: |
          BRANCH="${GITHUB_REF_NAME:-$(echo ${GITHUB_REF#refs/heads/})}"
          if [ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ] && [ "$BRANCH" == "main" ]; then
            echo "🚫 workflow_dispatch no está permitido en la rama 'main'"
            exit 1
          fi

          # Detectar entorno
          if [ "$BRANCH" == "main" ]; then
            ENV_LOWER="prod"
          else
            ENV_LOWER="test"
          fi
          ENV_UPPER=$(echo "$ENV_LOWER" | tr '[:lower:]' '[:upper:]')

          echo "ENV_UPPER=$ENV_UPPER" >> $GITHUB_ENV

      - name: Show environment info
        run: |
          echo "ENV_UPPER=$ENV_UPPER" >> $GITHUB_ENV
          if [ "$ENV_UPPER" = "PROD" ]; then
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_PROD_ACCESS_KEY_ID }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_PROD_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
            echo "SAGEMAKER_ROLE=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_PROD }}:role/SageMakerExecutionRole" >> $GITHUB_ENV
          else
            echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_TEST_ACCESS_KEY_ID }}" >> $GITHUB_ENV
            echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_TEST_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
            echo "SAGEMAKER_ROLE=arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID_TEST }}:role/SageMakerExecutionRole" >> $GITHUB_ENV
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
    
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate data
        run: python src/validate_data.py

      - name: Launch training on SageMaker
        run: python src/pipeline_launcher.py